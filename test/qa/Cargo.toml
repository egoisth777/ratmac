[package]
name = "ratmac-qa"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "guard-probe"
path = "src/bin/guard_probe.rs"

[[bin]]
name = "snapshot-manifest"
path = "src/bin/snapshot_manifest.rs"

[[bin]]
name = "lock-barrier"
path = "src/bin/lock_barrier.rs"

# DEB-001: the harness copy of the Engine command is named for what it is,
# so it never writes over the shipped `rtm`.
[[bin]]
name = "rtm-qa"
path = "../../src/bin/rtm.rs"

# WCP-002: one default aggregate binary runs the lane sweep suites in one
# process; each suite stays explicitly runnable by name (`--test <name>`).
[[test]]
name = "lane_sweeps"
path = "tests/lane_sweeps.rs"

[[test]]
name = "t108_lane_sweep"
path = "tests/t108_lane_sweep.rs"
test = false

[[test]]
name = "t109_pre_split_ports"
path = "tests/t109_pre_split_ports.rs"
test = false

[[test]]
name = "t110_post_split_ports"
path = "tests/t110_post_split_ports.rs"
test = false

[dependencies]
ratmac = { path = "../..", features = ["test-fault-injection"] }
toml = "0.8"
sha2 = "0.10"
