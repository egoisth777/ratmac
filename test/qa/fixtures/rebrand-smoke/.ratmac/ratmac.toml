[states.prepare]
prompt = "Prepare the rebrand smoke run."

[[states.prepare.guards]]
kind = "files_exact"
path = "artifacts"
entries = ["required.txt"]

[states.review]
prompt = "Review the rebrand smoke run."

[states.done]
prompt = "Finish the rebrand smoke run."

[[transitions]]
from = "prepare"
to = "review"

[[transitions]]
from = "review"
to = "done"
