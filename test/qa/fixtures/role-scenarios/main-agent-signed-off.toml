scenario = "main-agent-signed-off"
caller = "main-agent"
run_start_signoff = true
description = "The human signed off on the Run start for this target project, so the Main-Agent starts it once."

[[event]]
kind = "note"
outcome = "refrained"
reason = "human sign-off for this target project is recorded in the session"

[[event]]
kind = "tool_call"
command = "rtm start"
outcome = "invoked"
reason = "explicit human Run-start sign-off for the current target project"

[[event]]
kind = "tool_call"
command = "rtm status"
outcome = "invoked"
reason = "reading state is always allowed for the Main-Agent"
