# PT-017-01 fixture: all three Exit Guard fact types are required.
[states.guarded]
prompt = "Produce the guarded artifact."

[[states.guarded.guards]]
kind = "files_exact"
path = "artifacts"
entries = ["marker.txt", "result.yaml"]

[[states.guarded.guards]]
kind = "file_contains"
path = "artifacts/result.yaml"
contains = "result: ok"

[[states.guarded.guards]]
kind = "command_exit"
program = "rustc"
args = ["--version"]
expected = 0
# ETB-001: a toolchain probe reads no project state and is marked as such.
exempt = true

[states.complete]
prompt = "Complete."

[[transitions]]
from = "guarded"
to = "complete"
