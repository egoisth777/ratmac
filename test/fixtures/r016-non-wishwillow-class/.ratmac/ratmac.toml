[states.inspect]
prompt = "Inspect the source material and produce an inspection artifact."

[[states.inspect.guards]]
kind = "files_exact"
path = "artifacts"
entries = ["composition.ok", "inspection.ok"]
[states.compose]
prompt = "Compose the result from the inspected material."

[[states.compose.guards]]
kind = "files_exact"
path = "artifacts"
entries = ["composition.ok", "inspection.ok"]
[states.publish]
prompt = "Publish the completed result."

[[transitions]]
from = "inspect"
to = "compose"

[[transitions]]
from = "compose"
to = "publish"
