[states.prepare]
prompt = "Prepare the run."

[[states.prepare.guards]]
kind = "files_exact"
path = "artifacts"
entries = ["proof.txt"]

[states.done]
prompt = "Complete the run."

[[states.done.guards]]
kind = "files_exact"
path = "artifacts"
entries = ["proof.txt"]

[[transitions]]
from = "prepare"
to = "done"
