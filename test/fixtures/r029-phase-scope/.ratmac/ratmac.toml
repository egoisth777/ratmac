[phases.build]
prompt = "Build the selected artifact only."

[[phases.build.guards]]
kind = "files_exact"
path = "artifacts"
entries = ["release.txt"]

[[phases.build.guards]]
kind = "file_contains"
path = "artifacts/release.txt"
contains = "ready: true"

[[phases.build.guards]]
kind = "command_exit"
program = "rustc"
args = ["--version"]
expected = 0
# ETB-001: a toolchain probe reads no project state and is marked as such.
exempt = true

[phases.build-review]
prompt = "Review the selected artifact."

[phases.build-done]
prompt = "Finish the selected artifact."

[[transitions]]
from = "build"
to = "build-review"

[[transitions]]
from = "build-review"
to = "build-done"
