# The lane sweep declaration (tools/sweep_lanes.py) - the runbook's
# [roots]-table shape, repo-local beside ratmac.toml and turn.toml because
# the runbook parser owns that file's tables and refuses unknown keys.
#
# lanes   - the untracked root the sweep walks in id order (test-hidden/),
#           the same root the turn lifecycle copies per turn.
# report  - the one artifact a sweep writes; tracked, so the verdict the
#           close guard reads is reviewable history, while the in-crate
#           expiry markers it cites stay the markers of record.
# roster  - the landed crates the folder must hold. A crate the roster
#           expects and the folder lacks is named in the report, never
#           skipped; a crate the folder holds that the roster does not
#           declare is named as a stray entry and refuses the close check.
#           Every landing that adds a hidden crate adds its roster entry.
[roots]
lanes = "test-hidden"
report = ".ratmac/evidence/lane-sweep/report.md"
roster = [
  "t-058",
  "t-059",
  "t-060",
